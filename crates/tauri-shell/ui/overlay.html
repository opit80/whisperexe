<!DOCTYPE html>
<!--
  whisperexe overlay (WebView2, 320x128 seffaf hap). Kimlik: HAP.
  Intent:     F9 basiliyken goz klavyede; cevresel goruse tek odak.
  Hierarchy:  durum noktasi > sure (tabular-nums) > dusuk-bakiye rozeti > toast.
  Palette:    tek vurgu #7aa2ff; guncelleme halleri kehribar (mevcut dil).
  Motion:     160ms ease-out yalnizca opacity/transform; nabiz yok sayilmaz:
              prefers-reduced-motion'da statik rozet. Surucu ./overlay.js
              (harici dosya: Tauri CSP script-src 'self' inline'a izin vermez).
  Canli:      Tauri emit("overlay", view) -> __TAURI__.event.listen -> applyState.
  Onizleme:   tarayicida window.applyState(view) cagir; acilis hidden = normal.
              Tum id'ler + data-state adlari korunur (overlay.js sozlesmesi).
-->
<html lang="tr">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --accent: #7aa2ff;
    --ink: #e8eaf0;
    --muted: rgba(232, 234, 240, 0.62);
    --pill: rgba(18, 20, 28, 0.78);
    --edge: rgba(255, 255, 255, 0.1);
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font: 500 13px/1.4 system-ui, "Segoe UI", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 8px;
  }
  #pill {
    display: flex; align-items: center; gap: 10px;
    background: var(--pill);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid var(--edge);
    border-radius: 999px;
    padding: 9px 16px 9px 12px;
    min-width: 224px; max-width: 304px;
    transition: opacity 160ms var(--ease), transform 160ms var(--ease);
  }
  #pill[data-state="hidden"] { opacity: 0; transform: scale(0.95); pointer-events: none; }
  #dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); flex: none;
    box-shadow: 0 0 0 3px rgba(122, 162, 255, 0.18);
  }
  #pill[data-state="recording"] #dot.pulse { animation: pulse 1.2s ease-out infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.35; } 100% { opacity: 1; } }
  #pill[data-state="sending"] #dot { background: var(--accent); }
  #pill[data-state="queued"] #dot,
  #pill[data-state="done"] #dot { background: var(--accent); }
  #pill[data-state="update-pending"] #dot,
  #pill[data-state="update-blocked"] #dot { background: #e0a63c; box-shadow: 0 0 0 3px rgba(224, 166, 60, 0.18); }
  #secs {
    font-size: 22px; font-weight: 650; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; min-width: 3ch;
  }
  #label {
    color: var(--muted); font-size: 12px; letter-spacing: 0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #badge {
    margin-left: auto; flex: none;
    font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums;
    border: 1px solid var(--edge); border-radius: 999px;
    padding: 2px 8px; color: var(--muted); white-space: nowrap;
  }
  #toast {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--ink); background: var(--pill);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid var(--edge); border-radius: 10px;
    padding: 6px 12px; max-width: 300px; text-align: center;
    transition: opacity 160ms ease-out;
  }
  @media (prefers-reduced-motion: reduce) {
    #pill, #toast { transition: opacity 160ms ease-out; transform: none !important; }
    #pill[data-state="recording"] #dot.pulse { animation: none; }
  }
</style>
</head>
<body>
  <div id="pill" data-state="hidden" role="status" aria-live="polite">
    <span id="dot"></span>
    <span id="secs">0:00</span>
    <span id="label">hazır</span>
    <span id="badge" hidden></span>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="./overlay.js"></script>
</body>
</html>
