<!DOCTYPE html>
<!--
  whisperexe ana pencere (dogrudan acilir). Kimlik: BAKIYE TEZGAHI.
  Intent:     gunluk kullanici: gir, bakiyeni tek bakista gor, F9'a bas.
  Hierarchy:  bakiye hero (34px tabular) > dakika cipleri > sekmeli kimlik
              (Giris / Davetle ac) > durum izgarasi > F9 seridi.
  Palette:    gece tezgahi + tek vurgu #7aa2ff. Depth: borders-only.
  Motion:     160ms ease-out opacity/transform; reduced-motion'da statik.
  Surucu:     ./main.js (harici; CSP script-src 'self'). Tum id'ler korunur.
-->
<html lang="tr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="./app.css" />
<style>
  body { padding: 20px; }
  .wrap { display: flex; flex-direction: column; gap: 16px; max-width: 560px; margin: 0 auto; }
  .hero-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .hero-head .eyebrow { flex: 1; }
  .mins { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  form.grid { display: flex; flex-direction: column; gap: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kv { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 3px 0; }
  .kv .k { color: var(--muted); }
  #msg { min-height: 20px; }
  .hint { font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <span class="mark" aria-hidden="true"><span class="dot idle" id="netdot"></span></span>
    <div class="grow">
      <div class="apptitle">whisperexe</div>
      <div class="faint sub" id="ver">broker'a baglaniyor…</div>
    </div>
    <button class="ghost" id="adminbtn" type="button">Yönetim</button>
  </header>

  <section class="panel hero" aria-label="Bakiye">
    <div class="hero-head">
      <span class="eyebrow">bakiye</span>
      <span class="badge warn" id="lowbadge" hidden>10 dk alti</span>
    </div>
    <div class="hero-balance" id="balance">—</div>
    <div class="mins">
      <span class="minchip" id="minev">ev: —</span>
      <span class="minchip" id="minfb">fallback: —</span>
    </div>
  </section>

  <section class="panel" id="authpane" aria-label="Kimlik">
    <div id="loggedout">
      <div class="tabs" role="tablist" aria-label="Giris yontemi">
        <button type="button" class="tab on" id="tabbtn-login" role="tab" aria-selected="true" aria-controls="tab-login">Giriş</button>
        <button type="button" class="tab" id="tabbtn-redeem" role="tab" aria-selected="false" aria-controls="tab-redeem">Davetle aç</button>
      </div>
      <div id="tab-login" role="tabpanel">
        <form class="grid" id="loginform">
          <div>
            <label class="f" for="li-acc">Kullanıcı adı</label>
            <input type="text" id="li-acc" autocomplete="username" />
          </div>
          <div>
            <label class="f" for="li-pw">Şifre</label>
            <input type="password" id="li-pw" autocomplete="current-password" />
          </div>
          <div><button class="primary" type="submit" id="loginbtn">Giriş yap</button></div>
        </form>
      </div>
      <div id="tab-redeem" role="tabpanel" hidden>
        <form class="grid" id="redeemform">
          <div class="two">
            <div>
              <label class="f" for="rd-code">Davet kodu</label>
              <input type="text" id="rd-code" />
            </div>
            <div>
              <label class="f" for="rd-user">Kullanıcı adı</label>
              <input type="text" id="rd-user" autocomplete="username" />
            </div>
          </div>
          <div>
            <label class="f" for="rd-pw">Şifre belirle (en az 12 karakter)</label>
            <input type="password" id="rd-pw" autocomplete="new-password" />
          </div>
          <div><button type="submit" id="redeembtn">Hesabı aç</button></div>
        </form>
        <p class="hint muted" style="margin:10px 0 0">Davet kodu tek kullanımlık, 7 gün geçerli. İlk girişte şifreni belirlersin.</p>
      </div>
    </div>
    <div id="loggedin" hidden>
      <div class="eyebrow" style="margin-bottom:8px">hesap</div>
      <div class="kv"><span class="k">Kullanıcı</span><span id="acc">—</span></div>
      <div class="kv"><span class="k">Cihaz</span><span class="faint num" id="hwid">—</span></div>
      <div class="row" style="margin-top:12px">
        <button type="button" id="mebtn">Bakiyeyi tazele</button>
        <button type="button" class="ghost" id="logoutbtn">Çıkış</button>
      </div>
    </div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </section>

  <section class="panel" aria-label="Durum">
    <div class="eyebrow" style="margin-bottom:8px">durum</div>
    <div class="statgrid">
      <div class="stat"><span class="k">Broker</span><span class="v faint num" id="broker">—</span></div>
      <div class="stat"><span class="k">Sürüm</span><span class="v num" id="bver">—</span></div>
      <div class="stat"><span class="k">Taban</span><span class="v num" id="bfloor">—</span></div>
      <div class="stat"><span class="k">Güncelleme</span><span class="v" id="upd">—</span></div>
    </div>
    <div style="margin-top:8px"><button type="button" class="ghost" id="updbtn">Güncelle</button></div>
  </section>

  <footer class="f9bar">
    <kbd>F9</kbd><span class="hint muted">basılı tutarak konuş, bırakınca gönderilir.</span>
  </footer>
</div>
<script src="./main.js"></script>
</body>
</html>
