[package]
name = "panel"
version = "0.1.0"
edition = "2021"
description = "Broker yönetim paneli çekirdeği (F1c): hesap/davet, tarife, limit, acil şalter, HWID, saklama, disk, admin auth, sürüm beslemesi"

[dependencies]
argon2 = "0.5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
